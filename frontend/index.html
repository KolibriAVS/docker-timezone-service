<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мировое время - Встречи</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем Tailwind CSS для стилизации -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Светло-серый фон */
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Заголовок страницы -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 flex items-center justify-center gap-3">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                Расписание международных встреч
            </h1>
            <p class="text-gray-500 mt-2">Планируйте звонки и встречи с учетом часовых поясов</p>
        </header>

        <!-- Карточка добавления новой встречи -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Добавить новую встречу
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- Название -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Название встречи</label>
                    <input type="text" id="m_title" placeholder="Например: Созвон с инвесторами" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>

                <!-- Дата и время (Календарь) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Дата и время (По Москве)</label>
                    <input type="datetime-local" id="m_time" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>

                <!-- Часовой пояс (Континент + Город) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Целевой часовой пояс</label>
                    <div class="flex gap-2">
                        <!-- Выбор континента -->
                        <select id="m_continent" onchange="updateCities()" class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-white">
                            <option value="Europe">Европа (Europe)</option>
                            <option value="Asia">Азия (Asia)</option>
                            <option value="America">Америка (America)</option>
                            <option value="Africa">Африка (Africa)</option>
                            <option value="Australia">Австралия (Australia)</option>
                        </select>
                        
                        <!-- Ввод города с подсказками -->
                        <input list="city_list" id="m_city" placeholder="Город (на русском)" 
                               class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                        <datalist id="city_list">
                            <!-- Опции будут добавлены через JS -->
                        </datalist>
                    </div>
                </div>
            </div>

            <!-- Сообщение об успехе/ошибке -->
            <div id="result-msg" class="hidden mt-4 p-4 rounded-lg text-sm font-medium"></div>

            <!-- Кнопка сохранения -->
            <div class="mt-6 flex justify-end">
                <button onclick="addAndConvert()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors duration-200 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Конвертировать и сохранить
                </button>
            </div>
        </section>

        <!-- Карточка со списком встреч -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Сохраненные встречи
                </h2>
                <button onclick="loadMeetings()" class="text-indigo-600 bg-indigo-50 hover:bg-indigo-100 font-medium py-2 px-4 rounded-lg transition-colors text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Обновить список
                </button>
            </div>
            
            <!-- Сетка для карточек встреч -->
            <div id="meeting-list" class="grid grid-cols-1 gap-4">
                <div class="text-gray-400 text-center py-8">Нажмите "Обновить список", чтобы загрузить данные из базы.</div>
            </div>
        </section>

    </div>

    <script>
        const API_URL = "http://localhost:8000";

        // Словарь городов для подсказок (datalist) на русском
        const cityData = {
            "Europe": ["Лондон", "Париж", "Берлин", "Москва", "Рим", "Мадрид", "Амстердам", "Киев", "Минск"],
            "Asia": ["Токио", "Шанхай", "Дубай", "Сингапур", "Сеул", "Бангкок", "Стамбул", "Ташкент", "Алматы"],
            "America": ["Нью-Йорк", "Лос-Анджелес", "Чикаго", "Торонто", "Сан-Паулу", "Мехико", "Буэнос-Айрес", "Вашингтон"],
            "Africa": ["Каир", "Йоханнесбург", "Найроби", "Касабланка", "Лагос"],
            "Australia": ["Сидней", "Мельбурн", "Брисбен", "Перт", "Аделаида"]
        };

        // Переводчик из русского в английский для часового пояса
        const cityTranslation = {
            "Лондон": "London", "Париж": "Paris", "Берлин": "Berlin", "Москва": "Moscow", "Рим": "Rome", "Мадрид": "Madrid", "Амстердам": "Amsterdam", "Киев": "Kiev", "Минск": "Minsk",
            "Токио": "Tokyo", "Шанхай": "Shanghai", "Дубай": "Dubai", "Сингапур": "Singapore", "Сеул": "Seoul", "Бангкок": "Bangkok", "Стамбул": "Istanbul", "Ташкент": "Tashkent", "Алматы": "Almaty",
            "Нью-Йорк": "New_York", "Лос-Анджелес": "Los_Angeles", "Чикаго": "Chicago", "Торонто": "Toronto", "Сан-Паулу": "Sao_Paulo", "Мехико": "Mexico_City", "Буэнос-Айрес": "Buenos_Aires", "Вашингтон": "Washington",
            "Каир": "Cairo", "Йоханнесбург": "Johannesburg", "Найроби": "Nairobi", "Касабланка": "Casablanca", "Лагос": "Lagos",
            "Сидней": "Sydney", "Мельбурн": "Melbourne", "Брисбен": "Brisbane", "Перт": "Perth", "Аделаида": "Adelaide"
        };

        // Функция обновления подсказок городов при смене континента
        function updateCities() {
            const continent = document.getElementById("m_continent").value;
            const dataList = document.getElementById("city_list");
            const cityInput = document.getElementById("m_city");
            
            dataList.innerHTML = "";
            cityInput.value = "";

            if (cityData[continent]) {
                cityData[continent].forEach(city => {
                    let option = document.createElement("option");
                    option.value = city;
                    dataList.appendChild(option);
                });
            }
        }

        window.onload = updateCities;

        // Показ сообщений
        function showMessage(text, isError = false) {
            const msgBox = document.getElementById("result-msg");
            msgBox.classList.remove("hidden", "bg-green-100", "text-green-800", "bg-red-100", "text-red-800");
            
            if (isError) {
                msgBox.classList.add("bg-red-100", "text-red-800");
            } else {
                msgBox.classList.add("bg-green-100", "text-green-800");
            }
            msgBox.innerText = text;
            
            setTimeout(() => msgBox.classList.add("hidden"), 5000);
        }

        // Загрузка встреч
        async function loadMeetings() {
            try {
                const res = await fetch(`${API_URL}/meetings`);
                const data = await res.json();
                const list = document.getElementById("meeting-list");
                list.innerHTML = "";

                if (data.length === 0) {
                    list.innerHTML = '<div class="text-gray-400 text-center py-4">Список пуст</div>';
                    return;
                }

                data.forEach(m => {
                    const card = document.createElement("div");
                    card.className = "p-4 rounded-xl border border-gray-100 bg-gray-50 hover:bg-gray-100 transition-colors flex flex-col md:flex-row md:items-center justify-between gap-4";
                    
                    const timeOriginal = m.base_time.split('.')[0]; 
                    const timeConverted = m.converted_time ? m.converted_time.split('.')[0] : 'Ошибка расчета';

                    // Добавлена кнопка удаления с иконкой корзины в правый блок
                    card.innerHTML = `
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-lg">${m.title}</h3>
                            <div class="text-sm text-gray-500 mt-1 flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Исходное (МСК): <span class="font-medium text-gray-700">${timeOriginal}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="bg-indigo-50 border border-indigo-100 px-4 py-3 rounded-lg min-w-[200px]">
                                <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-1">Время в ${m.target_tz}</div>
                                <div class="text-lg font-bold text-indigo-900">${timeConverted}</div>
                            </div>
                            <button onclick="deleteMeeting(${m.id})" class="p-3 text-red-500 hover:text-red-700 bg-white border border-red-100 hover:bg-red-50 rounded-lg transition-colors shadow-sm" title="Удалить встречу">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                showMessage("Не удалось загрузить данные с сервера.", true);
            }
        }

        // Удаление встречи
        async function deleteMeeting(id) {
            try {
                const res = await fetch(`${API_URL}/delete_meeting/${id}`, {
                    method: "DELETE"
                });
                
                if (res.ok) {
                    showMessage("Встреча успешно удалена");
                    loadMeetings(); // Обновляем список сразу после удаления
                } else {
                    showMessage("Ошибка при удалении", true);
                }
            } catch (error) {
                console.error("Ошибка удаления:", error);
                showMessage("Не удалось связаться с сервером.", true);
            }
        }

        // Отправка новой встречи
        async function addAndConvert() {
            const title = document.getElementById("m_title").value;
            const datetimeLocal = document.getElementById("m_time").value;
            const continent = document.getElementById("m_continent").value;
            let cityInput = document.getElementById("m_city").value.trim();

            if (!title || !datetimeLocal || !cityInput) {
                showMessage("Пожалуйста, заполните все поля!", true);
                return;
            }

            const formattedTime = datetimeLocal.replace('T', ' ') + ':00';

            // Переводим город на английский, если он есть в словаре. Если нет - берем то, что ввел пользователь.
            let cityEnglish = cityTranslation[cityInput] || cityInput;
            cityEnglish = cityEnglish.replace(/\s+/g, '_'); // На всякий случай заменяем пробелы на _
            
            const targetTimezone = `${continent}/${cityEnglish}`;

            const payload = {
                title: title,
                base_time: formattedTime,
                target_timezone: targetTimezone
            };

            try {
                const res = await fetch(`${API_URL}/add_meeting`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (data.status === "success" && data.converted) {
                    showMessage(`Успешно! Время для ${cityInput}: ${data.converted}`);
                    document.getElementById("m_title").value = "";
                    document.getElementById("m_time").value = "";
                    document.getElementById("m_city").value = "";
                    loadMeetings();
                } else {
                    showMessage("Ошибка при конвертации времени. Убедитесь, что город указан верно.", true);
                }
            } catch (error) {
                console.error("Ошибка отправки:", error);
                showMessage("Не удалось связаться с сервером.", true);
            }
        }
    </script>
</body>
</html>
