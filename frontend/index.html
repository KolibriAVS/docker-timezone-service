<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мировое время - Продвинутая версия</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-10">

    <div class="max-w-5xl mx-auto pt-10 px-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2"><i class="fa-solid fa-globe text-indigo-600 mr-2"></i>Глобальное расписание</h1>
            <p class="text-slate-500">Мониторинг времени, независимая конвертация и планирование встреч</p>
        </div>

        <!-- Блок 1: Часы реального времени -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Москва (Базовое)</div>
                <div id="clock-msk" class="text-2xl font-mono font-bold text-indigo-600">--:--:--</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Лондон (-3 ч)</div>
                <div id="clock-lon" class="text-2xl font-mono font-bold text-slate-700">--:--:--</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Нью-Йорк (-7 ч)</div>
                <div id="clock-ny" class="text-2xl font-mono font-bold text-slate-700">--:--:--</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 text-center">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Токио (+6 ч)</div>
                <div id="clock-tok" class="text-2xl font-mono font-bold text-slate-700">--:--:--</div>
            </div>
        </div>

        <!-- Блок 2: Независимый конвертер -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center"><i class="fa-solid fa-calculator text-slate-400 mr-2"></i>Калькулятор часовых поясов</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Исходное время</label>
                    <input type="datetime-local" id="calc-time" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Из пояса</label>
                    <select id="calc-source" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <optgroup label="Россия">
                            <option value="Europe/Kaliningrad">Калининград (МСК-1)</option>
                            <option value="Europe/Moscow" selected>Москва (МСК)</option>
                            <option value="Europe/Samara">Самара (МСК+1)</option>
                            <option value="Asia/Yekaterinburg">Екатеринбург (МСК+2)</option>
                            <option value="Asia/Omsk">Омск (МСК+3)</option>
                            <option value="Asia/Novosibirsk">Новосибирск (МСК+4)</option>
                            <option value="Asia/Irkutsk">Иркутск (МСК+5)</option>
                            <option value="Asia/Vladivostok">Владивосток (МСК+7)</option>
                            <option value="Asia/Kamchatka">Камчатка (МСК+9)</option>
                        </optgroup>
                        <optgroup label="Европа">
                            <option value="Europe/London">Лондон</option>
                            <option value="Europe/Paris">Париж / Берлин / Рим</option>
                            <option value="Europe/Istanbul">Стамбул</option>
                        </optgroup>
                        <optgroup label="Азия">
                            <option value="Asia/Dubai">Дубай</option>
                            <option value="Asia/Tokyo">Токио</option>
                            <option value="Asia/Shanghai">Пекин / Шанхай</option>
                            <option value="Asia/Singapore">Сингапур</option>
                        </optgroup>
                        <optgroup label="Америка">
                            <option value="America/New_York">Нью-Йорк / Торонто</option>
                            <option value="America/Chicago">Чикаго</option>
                            <option value="America/Los_Angeles">Лос-Анджелес</option>
                            <option value="America/Sao_Paulo">Сан-Паулу / Буэнос-Айрес</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">В пояс</label>
                    <select id="calc-target" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <optgroup label="Россия">
                            <option value="Europe/Moscow">Москва (МСК)</option>
                            <option value="Asia/Yekaterinburg">Екатеринбург (МСК+2)</option>
                            <option value="Asia/Novosibirsk">Новосибирск (МСК+4)</option>
                            <option value="Asia/Vladivostok">Владивосток (МСК+7)</option>
                        </optgroup>
                        <optgroup label="Европа">
                            <option value="Europe/London">Лондон</option>
                            <option value="Europe/Paris">Париж / Берлин / Рим</option>
                            <option value="Europe/Istanbul">Стамбул</option>
                        </optgroup>
                        <optgroup label="Азия">
                            <option value="Asia/Dubai">Дубай</option>
                            <option value="Asia/Tokyo" selected>Токио</option>
                            <option value="Asia/Shanghai">Пекин / Шанхай</option>
                            <option value="Asia/Singapore">Сингапур</option>
                        </optgroup>
                        <optgroup label="Америка">
                            <option value="America/New_York">Нью-Йорк / Торонто</option>
                            <option value="America/Los_Angeles">Лос-Анджелес</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <button onclick="calculateStandalone()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-lg transition">Рассчитать</button>
                </div>
            </div>
            <div id="calc-result" class="mt-4 hidden p-3 bg-indigo-50 rounded-lg text-indigo-800 font-medium border border-indigo-100"></div>
        </div>

        <!-- Блок 3: База данных и планирование -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Левая колонка: Добавление -->
            <div class="md:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-4">
                    <h2 class="text-lg font-bold mb-4 flex items-center"><i class="fa-solid fa-plus text-indigo-500 mr-2"></i>Новая встреча</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">Название</label>
                            <input type="text" id="m_title" placeholder="Например: Созвон" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">Время (По Москве)</label>
                            <input type="datetime-local" id="m_time" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Континент</label>
                                <select id="m_continent" onchange="updateCityList()" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
                                    <option value="Europe">Европа</option>
                                    <option value="Asia">Азия</option>
                                    <option value="America">Америка</option>
                                    <option value="Australia">Австралия и Океания</option>
                                    <option value="Africa">Африка</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Город</label>
                                <input type="text" id="m_city" list="city-list" placeholder="На русском" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500">
                                <datalist id="city-list"></datalist>
                            </div>
                        </div>
                        <button onclick="addAndConvert()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition mt-2">Сохранить в БД</button>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Список -->
            <div class="md:col-span-2">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold flex items-center"><i class="fa-solid fa-database text-slate-400 mr-2"></i>Сохраненные встречи</h2>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-400 uppercase hidden md:inline">Отображать в:</span>
                            <select id="my-timezone" onchange="loadMeetings()" class="text-sm border border-slate-300 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500 outline-none font-medium text-indigo-700">
                                <optgroup label="Россия">
                                    <option value="Europe/Kaliningrad">Калининград (МСК-1)</option>
                                    <option value="Europe/Moscow">Москва (МСК)</option>
                                    <option value="Asia/Yekaterinburg">Екатеринбург (МСК+2)</option>
                                    <option value="Asia/Novosibirsk">Новосибирск (МСК+4)</option>
                                    <option value="Asia/Vladivostok">Владивосток (МСК+7)</option>
                                </optgroup>
                                <optgroup label="Мир">
                                    <option value="Europe/London">Лондон (-3 ч от МСК)</option>
                                    <option value="America/New_York">Нью-Йорк (-7 ч от МСК)</option>
                                    <option value="Asia/Tokyo">Токио (+6 ч от МСК)</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                    
                    <div id="meeting-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        // Масштабный словарь городов мира для автодополнения и перевода
        const cityData = {
            "Europe": { 
                "Москва": "Moscow", "Санкт-Петербург": "Moscow", "Калининград": "Kaliningrad", "Самара": "Samara",
                "Лондон": "London", "Париж": "Paris", "Берлин": "Berlin", "Рим": "Rome", "Мадрид": "Madrid", "Стамбул": "Istanbul"
            },
            "Asia": { 
                "Екатеринбург": "Yekaterinburg", "Омск": "Omsk", "Новосибирск": "Novosibirsk", "Красноярск": "Krasnoyarsk",
                "Иркутск": "Irkutsk", "Якутск": "Yakutsk", "Владивосток": "Vladivostok", "Магадан": "Magadan", "Камчатка": "Kamchatka",
                "Токио": "Tokyo", "Дубай": "Dubai", "Сингапур": "Singapore", "Сеул": "Seoul", "Бангкок": "Bangkok",
                "Пекин": "Shanghai", "Гонконг": "Hong_Kong", "Ташкент": "Tashkent", "Алматы": "Almaty"
            },
            "America": { 
                "Нью-Йорк": "New_York", "Лос-Анджелес": "Los_Angeles", "Торонто": "Toronto", "Чикаго": "Chicago",
                "Мехико": "Mexico_City", "Сан-Паулу": "Sao_Paulo", "Буэнос-Айрес": "Argentina/Buenos_Aires", "Гавана": "Havana"
            },
            "Australia": {
                "Сидней": "Sydney", "Мельбурн": "Melbourne", "Брисбен": "Brisbane", "Перт": "Perth"
            },
            "Africa": {
                "Каир": "Cairo", "Йоханнесбург": "Johannesburg", "Найроби": "Nairobi"
            }
        };

        function updateCityList() {
            const cont = document.getElementById("m_continent").value;
            const datalist = document.getElementById("city-list");
            datalist.innerHTML = "";
            for (let ruCity in cityData[cont]) {
                let opt = document.createElement("option");
                opt.value = ruCity;
                datalist.appendChild(opt);
            }
            document.getElementById("m_city").value = ""; 
        }
        
        updateCityList();

        function updateClocks() {
            const now = new Date();
            const formatTime = (tz) => new Intl.DateTimeFormat('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
            
            document.getElementById('clock-msk').innerText = formatTime('Europe/Moscow');
            document.getElementById('clock-lon').innerText = formatTime('Europe/London');
            document.getElementById('clock-ny').innerText = formatTime('America/New_York');
            document.getElementById('clock-tok').innerText = formatTime('Asia/Tokyo');
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        async function calculateStandalone() {
            const timeVal = document.getElementById("calc-time").value;
            if (!timeVal) return alert("Выберите время!");
            
            const payload = {
                base_time: timeVal.replace("T", " ") + ":00",
                source_tz: document.getElementById("calc-source").value,
                target_tz: document.getElementById("calc-target").value
            };

            const res = await fetch(`${API_URL}/convert_standalone`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            const resBox = document.getElementById("calc-result");
            resBox.classList.remove("hidden");
            resBox.innerHTML = `В поясе <b>${payload.target_tz}</b> будет: <b>${data.converted_time}</b> <span class="ml-2 px-2 py-0.5 bg-indigo-200 text-indigo-900 rounded text-xs">Разница: ${data.difference} ч.</span>`;
        }

        function formatToSelectedTz(moscowTimeStr, targetTz) {
            const isoStr = moscowTimeStr.replace(' ', 'T') + '+03:00';
            const dateObj = new Date(isoStr);
            const formatter = new Intl.DateTimeFormat('ru-RU', {
                timeZone: targetTz, year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            return formatter.format(dateObj).replace(',', '');
        }

        async function loadMeetings() {
            const res = await fetch(`${API_URL}/meetings`);
            const data = await res.json();
            const list = document.getElementById("meeting-list");
            const myTz = document.getElementById("my-timezone").value;
            
            list.innerHTML = "";
            data.forEach(m => {
                const adaptedTime = formatToSelectedTz(m.base_time, myTz);
                const isError = !m.converted_time || m.converted_time === "null" || m.converted_time.includes("error");
                
                list.innerHTML += `
                <div class="p-4 border border-slate-100 rounded-xl bg-slate-50 flex justify-between items-center hover:shadow-md transition">
                    <div>
                        <h3 class="font-bold text-slate-800 text-md">${m.title}</h3>
                        <div class="text-xs text-slate-500 mt-1 flex items-center">
                            <i class="fa-regular fa-clock mr-1"></i> Исходное: ${adaptedTime} (в выбранном поясе)
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right">
                            <div class="text-[10px] font-bold text-indigo-500 uppercase">В поясе ${m.target_tz}</div>
                            <div class="font-mono font-bold ${isError ? 'text-red-400' : 'text-slate-700'}">${isError ? 'Неверный город' : m.converted_time}</div>
                        </div>
                        <button onclick="deleteMeeting(${m.id})" class="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition" title="Удалить встречу">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            });
        }

        async function addAndConvert() {
            const titleVal = document.getElementById("m_title").value || "Без названия";
            const timeVal = document.getElementById("m_time").value;
            const contVal = document.getElementById("m_continent").value;
            const cityVal = document.getElementById("m_city").value.trim();

            if (!timeVal) return alert("Пожалуйста, выберите дату и время.");
            if (!cityVal) return alert("Пожалуйста, введите город.");

            let enCity = cityVal;
            if (cityData[contVal] && cityData[contVal][cityVal]) {
                enCity = cityData[contVal][cityVal];
            } else {
                enCity = cityVal.replace(/\s+/g, '_');
            }

            const payload = {
                title: titleVal,
                base_time: timeVal.replace("T", " ") + ":00",
                target_timezone: `${contVal}/${enCity}`
            };

            await fetch(`${API_URL}/add_meeting`, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
            });
            
            document.getElementById("m_title").value = "";
            document.getElementById("m_time").value = "";
            document.getElementById("m_city").value = "";
            
            loadMeetings();
        }

        async function deleteMeeting(id) {
            await fetch(`${API_URL}/delete_meeting/${id}`, { method: "DELETE" });
            loadMeetings();
        }

        window.onload = loadMeetings;
    </script>
</body>
</html>
